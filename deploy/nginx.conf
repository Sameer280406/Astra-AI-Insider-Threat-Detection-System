events {}
http {
  server {
    listen 80;
    client_max_body_size 1m;
    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_read_timeout 3600s; }
    location /docs { proxy_pass http://backend:8000; }
    location = /openapi.json { proxy_pass http://backend:8000; }
    location /health { proxy_pass http://backend:8000; }
    location / { proxy_pass http://frontend:3000; proxy_set_header Host $host; }
  }
}
