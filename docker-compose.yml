services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: astra
      POSTGRES_USER: astra_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U astra_migrator -d astra"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 15
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://astra_migrator:${POSTGRES_PASSWORD}@postgres:5432/astra
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://astra_app:${APP_DB_PASSWORD}@postgres:5432/astra
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 15
  forensics-worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://astra_app:${APP_DB_PASSWORD}@postgres:5432/astra
      REDIS_URL: redis://redis:6379/0
    command: [python, -m, app.forensics_worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build: .
    environment:
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      backend: {condition: service_healthy}
  web:
    image: nginx:1.27-alpine
    ports: ['3000:80']
    volumes: [./deploy/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [frontend,backend]
volumes:
  pgdata:
  redisdata:
